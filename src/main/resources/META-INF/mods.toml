modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# RP Core — общая библиотека семейства RP: обязательна. RP Perks и RP Stamina — по желанию.
[[dependencies.${mod_id}]]
    modId="rpcore"
    mandatory=true
    versionRange = "[0.3,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="rpperks"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"

# RP Culinary — питание (сытость, вода, нутриенты, вес); связь только через RP Core.
[[dependencies.${mod_id}]]
    modId="rpculinary"
    mandatory=false
    versionRange="[0.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="rpstamina"
    mandatory=false
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="tacz"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="zerocontact"
    mandatory=false
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
